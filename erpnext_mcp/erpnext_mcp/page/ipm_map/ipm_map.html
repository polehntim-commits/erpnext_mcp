<div class="ipm-wrap">
	<!-- SPDX-License-Identifier: MIT

		The shell of /app/ipm-map (v0.263.0). Markup only: ipm_map.js fills it from
		erpnext_mcp.api.ipm_map, which answers from the same ipm_graph.graph() the phone uses.
		Comments and style live INSIDE the root element and visible text uses &#39; for an
		apostrophe, for the reasons land_map.html gives.
	-->
	<style>
		.ipm-wrap { display: flex; flex-direction: column; gap: 10px; }
		.ipm-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
		.ipm-bar .form-group { margin: 0; min-width: 140px; }
		.ipm-bar label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; display: block; }
		.ipm-checks { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
		.ipm-checks label { display: inline-flex; gap: 4px; align-items: center; margin: 0; color: var(--text-color); }
		.ipm-main { display: flex; gap: 10px; min-height: 620px; }
		.ipm-graph { flex: 1 1 auto; min-height: 620px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg); }
		.ipm-panel { flex: 0 0 340px; max-height: 720px; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 13px; }
		.ipm-panel h4 { margin: 0 0 6px; }
		.ipm-panel .ipm-muted { color: var(--text-muted); font-size: 12px; }
		.ipm-panel ul { padding-left: 16px; margin: 4px 0 10px; }
		.ipm-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-muted); }
		.ipm-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
		.ipm-line { display: inline-block; width: 18px; height: 0; border-top: 2px solid; margin-right: 4px; vertical-align: middle; }
		.ipm-status { font-size: 12px; color: var(--text-muted); }
		.ipm-caveat { font-size: 11px; color: var(--text-muted); }
		@media (max-width: 900px) { .ipm-main { flex-direction: column; } .ipm-panel { flex-basis: auto; } }
	</style>
	<div class="ipm-bar ipm-filters"></div>
	<div class="ipm-bar">
		<div class="ipm-checks ipm-kinds"></div>
	</div>
	<div class="ipm-bar">
		<div class="ipm-checks ipm-relations"></div>
		<div class="ipm-checks ipm-provenance"></div>
	</div>
	<div class="ipm-bar ipm-actions"></div>
	<div class="ipm-status"></div>
	<div class="ipm-main">
		<div class="ipm-graph"></div>
		<div class="ipm-panel"><span class="ipm-muted">Click a node for its details, relationships, thresholds and recent observations.</span></div>
	</div>
	<div class="ipm-legend"></div>
	<div class="ipm-caveat"></div>
</div>
