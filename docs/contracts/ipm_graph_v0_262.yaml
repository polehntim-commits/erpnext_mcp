# IPM relationship graph — the frozen contract. erpnext_mcp v0.262.0 + FarmOps 0.49.0.
# Tim, 2026-10-06 (approved feature). Server and iOS build against THIS FILE and the fixtures in
# tests_standalone/contract/v0_262_0/ (byte-identical copies in
# fafo_ios FarmOpsKit/Tests/FarmOpsKitTests/Fixtures/contract_v0_262_0/). A change to either is a
# contract change: edit here first, regenerate the fixtures, copy them, then change code.
#
# Conventions (as every phone route): POST /api/method/erpnext_mcp.api.mobile.<route>, JSON body,
# answer wrapped in {"message": …}. Datetimes "YYYY-MM-DD HH:MM:SS" site time. Unknown keys are
# ignored by the phone; unknown enum values decode to "unknown" and still render.

version: "0.262.0"

enums:
  kind:            # IPM Organism.kind
    - Crop
    - Variety
    - Insect Pest
    - Mite Pest
    - Disease
    - Weed
    - Vertebrate Pest
    - Beneficial Insect
    - Beneficial Mite
    - Beneficial Microbe
    - Beneficial Vertebrate
    - Pollinator
    - Product
  relation:        # IPM Relationship.relation — direction is subject → object
    attacks: "pest/disease/weed → crop or variety"
    preys_on: "beneficial → pest"
    parasitizes: "beneficial → pest"
    controls: "product (or microbe) → pest/disease/weed"
    harmed_by: "beneficial or pollinator → product"
    hosts: "organism → organism it shelters (alternate host, overwintering site)"
    competes_with: "organism → organism"
    pollinates: "pollinator → crop"
  provenance: [Literature, Farm Observed, User Entered, AI Proposed, Imported]
  status: [Proposed, Active, Rejected]
  protected_status: ["", MBTA, MBTA Depredation Order, State Protected, ESA]
  threshold_status: [below, warning, action, unmeasured, no_threshold, not_approved]
  option_kind: [biological, cultural, exclusion, product]

# ── node and edge, as every answer carries them ─────────────────────────────
node:
  id: "string — IPM Organism docname, a stable slug, e.g. 'spotted-wing-drosophila'"
  name: string
  kind: kind
  scientific_name: string|null
  parent: "string|null — variety → its crop"
  protected_status: protected_status
  protected_note: string|null
  bbch_from: int|null
  bbch_to: int|null
  dd_from: number|null
  dd_to: number|null
  active_now: "bool|null — null when no stage is known"
  item: "string|null — Product: the ERPNext Item"
  epa_reg_number: string|null
  ccf_gate: "string|null — e.g. 'rodent_bait': the option is gated by those compliance rules"
  provenance: provenance
  enabled: bool

edge:
  id: "string — IPM Relationship docname"
  subject: "node id"
  relation: relation
  object: "node id"
  weight: "number 0–1 | null — efficacy (controls), toxicity (harmed_by), effectiveness (preys_on/parasitizes), severity (attacks)"
  confidence: "number 0–1"
  provenance: provenance
  source: string|null
  notes: string|null
  crop: "node id | null — scope"
  bbch_from: int|null
  bbch_to: int|null
  active_now: bool|null
  status: status
  enabled: bool

# ── phone routes ─────────────────────────────────────────────────────────────
routes:
  get_ipm_graph:
    who: "any FarmOps role (entity-scoped)"
    params:
      crop: "node id or crop name; or"
      block: "a Field — crop and stage come from it (observed stage first, then degree-day estimate)"
      stage: "BBCH int, overrides the block's"
      depth: "1–3, default 2 (hops from the crop)"
      kinds: "comma list of kinds, optional"
      start: "int, default 0 — edge page"
      limit: "int, default 500, max 2000"
    answer:
      graph_version: "string — changes when any node/edge changes; the phone's cache key"
      crop: node
      block: string|null
      stage: {bbch: int|null, source: "observed|estimated|given|null", label: string|null}
      nodes: [node]
      edges: [edge]
      total_edges: int
      next_start: int|null
      can_edit: "bool — the caller may save relationships"
      label_caveat: string
    fixture: get_ipm_graph.json

  get_ipm_organism:
    who: "any FarmOps role"
    params: {organism: "node id"}
    answer:
      node: node
      description: string|null
      aliases: [string]
      edges: "[edge] — in and out, enabled only"
      thresholds: "[threshold]"
      can_edit: bool
    fixture: get_ipm_organism.json

  save_ipm_relationship:
    who: "Farm Manager, Compliance Officer, System Manager (require_compliance_role)"
    params:
      relationship: "edge id to edit; omit to create"
      subject: "node id (create)"
      relation: "relation (create)"
      object: "node id (create)"
      weight: number|null
      confidence: number|null
      notes: string|null
      crop: string|null
      bbch_from: int|null
      bbch_to: int|null
      enabled: bool|null
      client_request_id: "string — queued offline; a resend is the same save"
    rules:
      - "A phone save lands Active, provenance User Entered (a manager's act)."
      - "Editing a Literature edge does not change it: the save writes a User Entered copy and disables nothing; re-seed never touches User Entered rows."
      - "Same subject+relation+object+crop as an existing user row updates that row."
    answer: {edge: edge, created: bool, replayed: "bool (only on a resend)"}
    fixture: save_ipm_relationship.json

  record_pest_observation:
    who: "any FarmOps role (workers log what they see)"
    params:
      block: "Field docname"
      organism: "node id (a pest, disease, weed or vertebrate)"
      count: number|null
      sample_unit: "Pest Action Threshold sample unit, optional"
      sample_size: int|null
      percent_affected: number|null
      beneficials_observed: number|null
      beneficial: "node id, optional"
      notes: string|null
      gps: "'lat,lon', optional"
      observed_at: "phone time, optional (queued offline)"
      client_request_id: string
    answer:
      observation: "Crop Observation docname"
      threshold_status: threshold_status_answer
    fixture: record_pest_observation.json

  get_ipm_threshold_status:
    who: "any FarmOps role"
    params: {organism: "node id", block: "Field, optional", crop: "optional", count: "number, optional", sample_unit: "optional"}
    answer: threshold_status_answer
    fixture: get_ipm_threshold_status.json

threshold:
  name: string
  crop: string|null
  crop_stage: string|null
  sample_unit: string|null
  comparison: string
  action_threshold: number|null
  warning_threshold: number|null
  recommended_methods: string|null
  status: "Proposed|Approved|Rejected"
  enabled: bool

threshold_status_answer:
  organism: node
  status: threshold_status
  threshold: "threshold|null — the one applied"
  observed: {count: number|null, sample_unit: string|null}
  message: "string — one plain sentence"
  options: "[option] — LOWEST IMPACT FIRST"
  protected_species_note: "string|null — MBTA species: non-lethal options lead; lethal options omitted"
  label_caveat: string

option:
  kind: option_kind
  title: string
  product: "node id | null"
  harms_active: "[node id] — beneficials/pollinators active now that this product harms"
  impact: "number 0–1 — 0 = harms nothing active"
  efficacy: number|null
  ccf_gate: "string|null — 'rodent_bait': must go through the rodent-bait task rules"
  note: string|null

# ── MCP tools (writes default OFF; every list paginated with start/limit; no hard caps) ──
mcp_tools:
  read: [list_ipm_organisms, get_ipm_organism, list_ipm_relationships, get_ipm_graph, export_ipm_graph]
  write:
    - create_ipm_organism
    - update_ipm_organism
    - create_ipm_relationship
    - update_ipm_relationship
    - import_ipm_graph        # CSV or JSON; dry_run defaults TRUE and returns the add/change/skip diff
    - propose_ipm_relationships   # AI-read handbook/regulation → Proposed, disabled, AI Proposed; same rails as propose_compliance_rule
    - approve_ipm_proposal    # a person approves or rejects proposals (nodes, edges, thresholds)
    - approve_pest_action_threshold
  existing_extended:
    set_pest_action_threshold: "takes organism, status"
    list_pest_action_thresholds: "returns organism, status; filter status"
